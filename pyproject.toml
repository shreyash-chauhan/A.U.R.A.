[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-desktop"
version = "0.1.0"
description = "Local-first Windows assistant prototype with a deterministic action layer and system-tray interface"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
voice = ["pyttsx3>=2.90", "sounddevice>=0.5", "vosk>=0.3.45", "winotify>=1.1.0", "psutil>=5.9", "pycaw>=20240210", "comtypes>=1.2"]
desktop = ["PySide6-Essentials>=6.7", "pyttsx3>=2.90", "sounddevice>=0.5", "vosk>=0.3.45", "opencv-python-headless>=4.10,<5"]

[project.scripts]
aura-desktop = "aura.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
